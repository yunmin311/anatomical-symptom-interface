name: verify

# The point of this workflow is that a reviewer — human or AI — can read the
# check status instead of taking the commit message's word for it. It runs the
# same three gates described in AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` key on purpose — package.json's `packageManager` field is
      # the single source of truth. Declaring it here as well makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests (domain core)
        run: pnpm test

      - name: API smoke tests
        run: |
          pnpm --filter @asi/server seed
          pnpm --filter @asi/server start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs

      - name: web build
        run: pnpm --filter @asi/web build

      - name: safety rules must be honestly marked unreviewed
        # Guards the release gate. If someone ever removes the review metadata
        # plumbing, this fails rather than silently shipping un-reviewed red
        # flag copy to users.
        run: |
          pnpm --filter @asi/server start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          count=$(curl -s http://localhost:8787/api/health | grep -o '"unreviewedSafetyRules":[0-9]*' | cut -d: -f2)
          echo "unreviewed red-flag rules: $count"
          if [ "$count" = "0" ]; then
            echo "::warning::No unreviewed red-flag rules. If clinical review has"
            echo "::warning::not actually happened, the review metadata was removed."
          fi
