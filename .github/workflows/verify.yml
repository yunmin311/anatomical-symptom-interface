name: verify

# The point of this workflow is that a reviewer — human or AI — can read the
# check status instead of taking the commit message's word for it. It runs the
# same gates described in AGENTS.md.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` key on purpose — package.json's `packageManager` field is
      # the single source of truth. Declaring it here as well makes
      # pnpm/action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: unit tests (domain core)
        run: pnpm test

      - name: API smoke tests
        run: |
          pnpm --filter @asi/server seed
          pnpm --filter @asi/server start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke.mjs

      - name: web build
        run: pnpm --filter @asi/web build

      # -------------------------------------------------------------------
      # ISSUE 8: release-safety metadata must be COMPLETE, not merely present.
      #
      # The previous version grepped a number out of the health payload and
      # treated an empty match as success. That means a renamed field, a changed
      # response shape, or a server that never started would all read as green.
      # This step parses the JSON, requires every field, requires the rule count
      # to be a positive integer, and fails loudly otherwise.
      # -------------------------------------------------------------------
      - name: release-safety metadata is well formed
        run: |
          pnpm --filter @asi/server start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8787/api/health -o /tmp/health.json
          node scripts/check-safety-metadata.mjs /tmp/health.json
